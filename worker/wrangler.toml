# Test environment only. Independent domain and D1; no production admin binding.
name = "shopline-quantity-breaks-test"
main = "src/index.ts"
compatibility_date = "2026-10-26"
keep_vars = true
workers_dev = true
preview_urls = false

routes = [
  { pattern = "app-test.vswwy.cn", zone_name = "vswwy.cn", custom_domain = true },
]

[[d1_databases]]
binding = "DB"
database_name = "shopline-quantity-breaks-test"
# Independent test database; never bind the production D1.
database_id = "9fcea996-fdc3-4ade-a792-c8659e42800c"
migrations_dir = "migrations"

[assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true

[observability.logs]
enabled = true

[vars]
SHOPLINE_APP_KEY = "26e3fa9b0b6deb7313e7f6a9e06163eaab66d54d"
SHOPLINE_APP_URL = "https://app-test.vswwy.cn"
SHOPLINE_PRODUCT_DISCOUNT_FUNCTION_ID = "754292a155d740809a5437a3f8c59231"
SCOPES = "read_products,write_products,read_discounts,write_discounts,read_store_information,read_markets,read_translation,read_orders"
SHOPLINE_QUANTITY_BREAKS_PUBLICATION_ENABLED = "true"

# Scheduler parity with source; runs against the independent test DB only.
[triggers]
crons = ["*/5 * * * *", "0 3 * * *"]
