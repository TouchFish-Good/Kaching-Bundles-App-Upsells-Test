<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quantity Breaks</title>
    <style id="app-bootstrap-shell-style">
      :root { color-scheme: light; }
      html, body, #root { min-height: 100%; margin: 0; }
      body { background: #ffffff; }
      #root[aria-live="polite"] { min-height: 100vh; }
      .app-bootstrap-shell { min-height: 100vh; box-sizing: border-box; margin: 0 auto; padding: 20px 32px; color: #102a2a; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .app-bootstrap-shell__frame { min-height: 260px; box-sizing: border-box; margin: 0 auto; border-radius: 8px; background: #fff; }
      .app-bootstrap-shell__frame-header, .app-bootstrap-shell__frame-cards { display: grid; gap: 10px; }
      .app-bootstrap-shell__frame-header { grid-template-columns: minmax(84px, 0) 360px; justify-content: space-between;align-items: center; }
      .app-bootstrap-shell__frame-header span, .app-bootstrap-shell__frame-cards span { display: block; height: 32px; border-radius: 4px; background: #edf0ee; animation: app-bootstrap-pulse 1.2s ease-in-out infinite alternate; }
      .app-bootstrap-shell__frame-header span:first-child { height: 46px; }
      .app-bootstrap-shell__frame-cards { grid-template-columns: repeat(4, minmax(0, 1fr));padding: 16px 0;}
      .app-bootstrap-shell__frame-cards span { height: 126px; }
      .app-bootstrap-shell__translation-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, .72fr); gap: 20px; }
      .app-bootstrap-shell__translation-editor, .app-bootstrap-shell__translation-preview { min-height: 320px; box-sizing: border-box; padding: 24px; border: 1px solid #e5e5e5; border-radius: 8px; background: #fff; }
      .app-bootstrap-shell__translation-toolbar, .app-bootstrap-shell__translation-row, .app-bootstrap-shell__translation-preview-header { display: grid; gap: 10px; }
      .app-bootstrap-shell__translation-toolbar, .app-bootstrap-shell__translation-preview-header { grid-template-columns: 1fr 120px; }
      .app-bootstrap-shell__translation-toolbar span, .app-bootstrap-shell__translation-row span, .app-bootstrap-shell__translation-preview-header span, .app-bootstrap-shell__translation-preview-canvas span { display: block; min-height: 16px; border-radius: 4px; background: #edf0ee; animation: app-bootstrap-pulse 1.2s ease-in-out infinite alternate; }
      .app-bootstrap-shell__translation-toolbar span:first-child { min-height: 46px; }
      .app-bootstrap-shell__translation-rows { display: grid; gap: 12px; margin-top: 24px; }
      .app-bootstrap-shell__translation-row { grid-template-columns: .7fr 1fr; }
      .app-bootstrap-shell__translation-row span { min-height: 36px; }
      .app-bootstrap-shell__translation-preview-canvas { display: grid; gap: 12px; margin-top: 24px; padding: 18px; border: 1px solid #edf0ee; border-radius: 6px; }
      .app-bootstrap-shell__translation-preview-canvas span { min-height: 68px; }
      .app-bootstrap-shell__editor-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, .72fr); gap: 20px; }
      .app-bootstrap-shell__editor-form, .app-bootstrap-shell__editor-preview { min-height: 360px; box-sizing: border-box; padding: 24px; border: 1px solid #e5e5e5; border-radius: 8px; background: #fff; }
      .app-bootstrap-shell__editor-row, .app-bootstrap-shell__editor-preview span { display: block; min-height: 42px; margin-bottom: 14px; border-radius: 5px; background: #edf0ee; animation: app-bootstrap-pulse 1.2s ease-in-out infinite alternate; }
      .app-bootstrap-shell__editor-preview span:first-child { min-height: 28px; }
      .app-bootstrap-shell__editor-preview span:last-child { min-height: 190px; }
      .app-bootstrap-shell--feedback { width: min(1180px, 100%); }
      .app-bootstrap-shell__feedback-header, .app-bootstrap-shell__feedback-toolbar, .app-bootstrap-shell__feedback-card { box-sizing: border-box; border: 1px solid #e5e5e5; border-radius: 8px; background: #fff; }
      .app-bootstrap-shell__feedback-header { min-height: 112px; padding: 24px; }
      .app-bootstrap-shell__feedback-toolbar { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 16px; min-height: 54px; margin-top: 20px; padding: 12px; }
      .app-bootstrap-shell__feedback-card { min-height: 126px; margin-top: 12px; padding: 20px; }
      .app-bootstrap-shell__feedback-header span, .app-bootstrap-shell__feedback-toolbar span, .app-bootstrap-shell__feedback-card span { display: block; min-height: 16px; margin-bottom: 12px; border-radius: 4px; background: #edf0ee; animation: app-bootstrap-pulse 1.2s ease-in-out infinite alternate; }
      .app-bootstrap-shell__feedback-header span:first-child { width: 180px; min-height: 28px; }
      .app-bootstrap-shell__feedback-toolbar span { min-height: 28px; margin: 0; }
      .app-bootstrap-shell__feedback-card span:first-child { width: 42%; min-height: 20px; }
      .app-bootstrap-shell__feedback-card span:last-child { width: 28%; margin-bottom: 0; }
      @keyframes app-bootstrap-pulse { from { opacity: .55; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .app-bootstrap-shell__frame-header span, .app-bootstrap-shell__frame-cards span { animation: none; } }
      @media (max-width: 700px) { .app-bootstrap-shell { width: auto; padding: 20px 16px 32px; } .app-bootstrap-shell__frame { padding: 20px; } .app-bootstrap-shell__frame-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } .app-bootstrap-shell__translation-grid, .app-bootstrap-shell__editor-grid { grid-template-columns: 1fr; } .app-bootstrap-shell__translation-editor, .app-bootstrap-shell__translation-preview, .app-bootstrap-shell__editor-form, .app-bootstrap-shell__editor-preview { padding: 20px; } .app-bootstrap-shell__feedback-toolbar { grid-template-columns: 1fr; } }
    </style>
    <script type="module">
      //  https://github.com/vitejs/vite/issues/1984

      import RefreshRuntime from '/@react-refresh';
      if (!import.meta.env || !import.meta.env.PROD) {
        RefreshRuntime.injectIntoGlobalHook(window);
        window.$RefreshReg$ = () => {};
        window.$RefreshSig$ = () => (type) => type;
        window.__vite_plugin_react_preamble_installed__ = true;
      }
    </script>
  </head>
  <body>
    <div id="root" aria-live="polite">
      <main class="app-bootstrap-shell app-bootstrap-shell--campaigns" role="status" aria-label="Loading workspace">
        <section class="app-bootstrap-shell__frame" aria-hidden="true">
          <div class="app-bootstrap-shell__frame-header"><span></span><span></span></div>
          <div class="app-bootstrap-shell__frame-cards"><span></span><span></span><span></span><span></span></div>
        </section>
      </main>
    </div>
    <script>
      (() => {
        const recoveryKey = 'quantity-breaks:bootstrap-recovery';
        let timer;

        function embeddedPath() {
          let path = new URLSearchParams(window.location.search).get('path') || window.location.pathname;
          for (let attempt = 0; attempt < 2; attempt += 1) {
            try {
              const decoded = decodeURIComponent(path);
              if (decoded === path) break;
              path = decoded;
            } catch { return window.location.pathname; }
          }
          return path;
        }

        function renderRouteSkeleton() {
          const path = embeddedPath();
          const root = document.getElementById('root');
          if (!root) return;
          if (path === '/quantity-breaks/translations') {
            root.innerHTML = '<main class="app-bootstrap-shell app-bootstrap-shell--translations" role="status" aria-label="Loading workspace"><div class="app-bootstrap-shell__translation-grid"><section class="app-bootstrap-shell__translation-editor"><div class="app-bootstrap-shell__translation-toolbar"><span></span><span></span></div><div class="app-bootstrap-shell__translation-rows"><div class="app-bootstrap-shell__translation-row"><span></span><span></span></div><div class="app-bootstrap-shell__translation-row"><span></span><span></span></div><div class="app-bootstrap-shell__translation-row"><span></span><span></span></div><div class="app-bootstrap-shell__translation-row"><span></span><span></span></div><div class="app-bootstrap-shell__translation-row"><span></span><span></span></div><div class="app-bootstrap-shell__translation-row"><span></span><span></span></div></div></section><section class="app-bootstrap-shell__translation-preview"><div class="app-bootstrap-shell__translation-preview-header"><span></span><span></span></div><div class="app-bootstrap-shell__translation-preview-canvas"><span></span><span></span><span></span></div></section></div></main>';
          }
          if (path === '/quantity-breaks/new' || /^\/quantity-breaks\/campaigns\/[^/]+\/edit$/.test(path)) {
            root.innerHTML = '<main class="app-bootstrap-shell app-bootstrap-shell--editor" role="status" aria-label="Loading workspace"><div class="app-bootstrap-shell__editor-grid"><section class="app-bootstrap-shell__editor-form"><span class="app-bootstrap-shell__editor-row"></span><span class="app-bootstrap-shell__editor-row"></span><span class="app-bootstrap-shell__editor-row"></span><span class="app-bootstrap-shell__editor-row"></span><span class="app-bootstrap-shell__editor-row"></span></section><section class="app-bootstrap-shell__editor-preview"><span></span><span></span><span></span></section></div></main>';
          }
          if (path === '/quantity-breaks/feedback') {
            root.innerHTML = '<main class="app-bootstrap-shell app-bootstrap-shell--feedback" role="status" aria-label="Loading workspace"><section class="app-bootstrap-shell__feedback-header"><span></span><span></span><span></span></section><section class="app-bootstrap-shell__feedback-toolbar"><span></span><span></span></section><section class="app-bootstrap-shell__feedback-card"><span></span><span></span><span></span></section><section class="app-bootstrap-shell__feedback-card"><span></span><span></span><span></span></section><section class="app-bootstrap-shell__feedback-card"><span></span><span></span><span></span></section></main>';
          }
        }

        renderRouteSkeleton();

        function recover() {
          try {
            if (window.sessionStorage.getItem(recoveryKey) === '1') {
              return;
            }
            window.sessionStorage.setItem(recoveryKey, '1');
          } catch {
            // Without a persistent marker, reloading can loop forever in a restricted iframe.
            return;
          }
          window.location.reload();
        }

        window.__quantityBreaksBootstrapReady = () => {
          window.clearTimeout(timer);
          try { window.sessionStorage.removeItem(recoveryKey); } catch { /* Storage is optional for startup. */ }
        };
        try { window.performance?.mark?.('quantity-breaks:guard'); } catch { /* Performance telemetry is optional. */ }
        timer = window.setTimeout(recover, 5_000);
      })();
    </script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
